default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  username: <%= ENV.fetch("DATABASE_USER", "pt502") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: pt502_development

test:
  <<: *default
  database: pt502_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
